name: CI

on:
  push:
    branches:
      - develop
      - main
  pull_request:
    branches:
      - develop
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run tests
      run: |
          pytest tests --browser=chrome --html=reportes/reporte_test_DEMOQA.html


    - name: Upload test report
      uses: actions/upload-artifact@v3
      with:
        name: test-report
        path: reportes/reportes/reporte_test_DEMOQA.html
